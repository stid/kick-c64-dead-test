name: Build Dead Test

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check version consistency
      run: |
        chmod +x scripts/check-version.sh
        ./scripts/check-version.sh

    - name: Validate PRN pattern
      run: |
        chmod +x scripts/validate-prn-pattern.py
        python3 scripts/validate-prn-pattern.py

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    
    - name: Cache KickAssembler
      id: cache-kickass
      uses: actions/cache@v4
      with:
        path: /tmp/KickAssembler
        key: kickass-5.25
    
    - name: Download KickAssembler
      if: steps.cache-kickass.outputs.cache-hit != 'true'
      run: |
        mkdir -p /tmp/KickAssembler
        cd /tmp/KickAssembler
        wget -q https://theweb.dk/KickAssembler/KickAssembler.zip
        unzip -q KickAssembler.zip
        rm KickAssembler.zip
    
    - name: Install VICE tools
      run: |
        sudo apt-get update
        sudo apt-get install -y vice
    
    - name: Build Dead Test
      run: |
        export KICKASS_BIN=/tmp/KickAssembler/KickAss.jar
        make clean
        make
    
    - name: Verify build artifacts
      run: |
        test -f bin/main.prg || (echo "main.prg not found" && exit 1)
        test -f bin/dead-test.crt || (echo "dead-test.crt not found" && exit 1)
        test -f bin/dead-test.bin || (echo "dead-test.bin not found" && exit 1)
        echo "Build artifacts verified:"
        ls -la bin/
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dead-test-binaries
        path: |
          bin/main.prg
          bin/dead-test.crt
          bin/dead-test.bin
        retention-days: 30
    
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: bin/buildlog.txt
        retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dead-test-binaries
        path: bin/
    
    - name: Install VICE
      run: |
        sudo apt-get update
        sudo apt-get install -y vice xvfb

    - name: Cache C64 ROM images
      id: cache-c64roms
      uses: actions/cache@v4
      with:
        path: /tmp/c64roms
        key: c64roms-r46189

    - name: Download C64 ROM images
      if: steps.cache-c64roms.outputs.cache-hit != 'true'
      run: |
        # The Debian/Ubuntu vice package ships WITHOUT the copyrighted C64
        # ROMs, so x64sc cannot boot the machine and every VICE step here
        # silently produced nothing. Fetch them from the VICE source tree
        # (pinned mirror tag). Cached so a raw.githubusercontent hiccup does
        # not fail every PR - the ROMs are now a hard gate on the build.
        mkdir -p /tmp/c64roms
        for f in kernal-901227-03.bin basic-901226-01.bin chargen-901225-01.bin; do
          curl -sfL --retry 3 --retry-delay 2 -o "/tmp/c64roms/$f" \
            "https://raw.githubusercontent.com/VICE-Team/svn-mirror/r46189/vice/data/C64/$f"
        done

    - name: Install C64 ROM images
      run: |
        # x64sc looks for the ROMs in the vice package's system data dir.
        sudo mkdir -p /usr/share/vice/C64
        sudo cp /tmp/c64roms/*.bin /usr/share/vice/C64/
        ls -la /usr/share/vice/C64/*.bin

    - name: Verify cartridge format
      run: |
        # Use cartconv to verify the cartridge format
        cartconv --types | grep -q "ulti" || (echo "Ultimax format not supported" && exit 1)
        cartconv -f bin/dead-test.crt || (echo "Invalid cartridge format" && exit 1)
    
    - name: Test in VICE (headless)
      run: |
        # Run VICE in headless mode for a short time to verify it loads
        # Using -limitcycles for clean exit (~985,248 cycles/sec * 10 sec = 10M cycles)
        # NOTE: +confirmonexit, not "-confirmonexit 0". It takes no value, and the
        # stray "0" was parsed as a positional argument, making VICE discard every
        # option after it - including -exitscreenshot.
        xvfb-run -a x64sc -default -cartcrt bin/dead-test.crt -warp -limitcycles 10000000 +confirmonexit -exitscreenshot bin/test-screenshot.png || true

        # The screenshot is the proof the cartridge actually ran - without
        # it this step verifies nothing, so its absence is a failure.
        if [ -f bin/test-screenshot.png ]; then
          echo "Dead Test loaded successfully in VICE"
        else
          echo "ERROR: no screenshot produced - cartridge run not verified"
          exit 1
        fi
    
    - name: Upload test screenshot
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-screenshot
        path: bin/test-screenshot.png
        retention-days: 7

  test-mode:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Cache KickAssembler
      id: cache-kickass
      uses: actions/cache@v4
      with:
        path: /tmp/KickAssembler
        key: kickass-5.25

    - name: Download KickAssembler
      if: steps.cache-kickass.outputs.cache-hit != 'true'
      run: |
        mkdir -p /tmp/KickAssembler
        cd /tmp/KickAssembler
        wget -q https://theweb.dk/KickAssembler/KickAssembler.zip
        unzip -q KickAssembler.zip
        rm KickAssembler.zip

    - name: Install VICE
      run: |
        sudo apt-get update
        sudo apt-get install -y vice xvfb

    - name: Cache C64 ROM images
      id: cache-c64roms
      uses: actions/cache@v4
      with:
        path: /tmp/c64roms
        key: c64roms-r46189

    - name: Download C64 ROM images
      if: steps.cache-c64roms.outputs.cache-hit != 'true'
      run: |
        # See the identical steps in the test job: the Debian/Ubuntu vice
        # package ships without the C64 ROMs and x64sc cannot boot without
        # them.
        mkdir -p /tmp/c64roms
        for f in kernal-901227-03.bin basic-901226-01.bin chargen-901225-01.bin; do
          curl -sfL --retry 3 --retry-delay 2 -o "/tmp/c64roms/$f" \
            "https://raw.githubusercontent.com/VICE-Team/svn-mirror/r46189/vice/data/C64/$f"
        done

    - name: Install C64 ROM images
      run: |
        sudo mkdir -p /usr/share/vice/C64
        sudo cp /tmp/c64roms/*.bin /usr/share/vice/C64/
        ls -la /usr/share/vice/C64/*.bin

    - name: Run TEST_MODE validation
      run: |
        export KICKASS_BIN=/tmp/KickAssembler/KickAss.jar
        export REQUIRE_SCREENSHOT=1
        chmod +x scripts/test-mode-validation.sh
        ./scripts/test-mode-validation.sh

    - name: Upload test-mode screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-mode-screenshots
        path: screenshots/*.png
        if-no-files-found: warn
        retention-days: 7

  release:
    needs: [build, test, test-mode]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dead-test-binaries
        path: bin/
    
    - name: Create release package
      run: |
        zip dead-test-${{ github.ref_name }}.zip bin/*
        tar -czf dead-test-${{ github.ref_name }}.tar.gz bin/*
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dead-test-${{ github.ref_name }}.zip
          dead-test-${{ github.ref_name }}.tar.gz
          bin/dead-test.crt
          bin/dead-test.bin
        draft: false
        prerelease: false
        generate_release_notes: true